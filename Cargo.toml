[workspace]
resolver = "2"
members = [
    "migration",
    "entity",
    "common",
    "storage",
    "api",
    "server",
    "cli",
    "signature",
    "xtask",
    "ui/crate",
]

[workspace.package]
version = "0.1.1"
edition = "2021"
license = "Apache-2.0"

[workspace.dependencies]
xhandler = { git = "https://github.com/project-openubl/xhandler-rust", branch = "main" }

openubl-migration = { path = "./migration" }
openubl-entity = { path = "./entity" }
openubl-common = { path = "./common" }
openubl-storage = { path = "./storage" }
openubl-api = { path = "./api" }
openubl-server = { path = "./server" }
openubl-ui = { path = "./ui/crate" }

log = "0.4"
tera = "1.20"
static-files = "0.3"
serde = { version = "1.0", features = ["derive"] }
zip = { version = "2.2" }
reqwest = "0.12"
base64 = "0.22"
thiserror = "2.0"
anyhow = "1.0"
tokio = "1.49"

sea-orm = "1"
sea-query = "0.32"
async-std = { version = "1" }
clap = "4"
minio = "0.1"
serde_json = "1"
uuid = "1.15"
aws-sdk-s3 = "1.72"
aws-config = "1.5"
aws-smithy-runtime = "1.7"
aws-smithy-runtime-api = "1.7"
async-trait = "0.1"
env_logger = "0.11"
utoipa = "5.3"
utoipa-actix-web = "0.1"
utoipa-swagger-ui = "9.0"
actix-web = "4.12"
actix-multipart = "0.7"
actix-web-static-files = "4"
